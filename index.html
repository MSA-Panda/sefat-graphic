
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEFAT GRAPHICS | Premium Anime Designer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'Poppins', 'sans-serif'],
            },
            colors: {
              glass: {
                light: 'rgba(255, 255, 255, 0.25)',
                dark: 'rgba(15, 23, 42, 0.25)',
              },
              brand: {
                blue: '#007FFF',
                orange: '#FF6600',
                white: '#FFFFFF',
                dark: '#0059B2',
              },
              accent: {
                blue: '#E0F2FE',
                violet: '#F5F3FF',
                cyan: '#ECFEFF',
                glow: '#007FFF',
              }
            },
            backdropBlur: {
              xs: '2px',
            },
            animation: {
              'pulse-slow': 'pulse 8s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'float': 'float 6s ease-in-out infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0px)' },
                '50%': { transform: 'translateY(-20px)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.2); /* Increased white opacity for white-theme emphasis */
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 8px 32px 0 rgba(0, 127, 255, 0.05);
      }
      .dark .glass-card {
        background: rgba(17, 24, 39, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
      }
      .gradient-bg {
        background: linear-gradient(135deg, #ffffff 0%, #f8fafc 50%, #f1f5f9 100%);
      }
      .dark .gradient-bg {
        background: linear-gradient(135deg, #0f172a 0%, #0c1a3a 50%, #020617 100%);
      }
      .mesh-gradient {
        position: fixed;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        overflow: hidden;
      }
      .mesh-blob {
        position: absolute;
        filter: blur(80px);
        border-radius: 50%;
        opacity: 0.25;
      }
      @keyframes morph {
        0%, 100% { border-radius: 40% 60% 70% 30% / 40% 40% 60% 50%; }
        33% { border-radius: 70% 30% 50% 50% / 30% 30% 70% 70%; }
        66% { border-radius: 100% 60% 60% 100% / 100% 100% 60% 60%; }
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(0, 127, 255, 0.2);
        border-radius: 10px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
      }
      .brand-text-gradient {
        background: linear-gradient(to right, #007FFF, #FF6600);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.12.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
</head>
<body class="gradient-bg transition-colors duration-500 text-slate-900 dark:text-slate-100">
    <div id="root"></div>
</body>
</html>
